<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Custos Fixos</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-dark: #1e3a8a;
            --primary-medium: #2563eb;
            --primary-light: #3b82f6;
            --bg-light: #f8fafc;
            --border-color: #cbd5e1;
            --text-main: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* Cabecalho e Acoes */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-dark);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-dark);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary-medium);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Tabela de Custos */
        .table-container {
            margin-bottom: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: var(--primary-dark);
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
            text-transform: uppercase;
        }

        th.amount, td.amount {
            text-align: right;
        }

        td {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f1f5f9;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="number"] {
            text-align: right;
        }

        .category-tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #e2e8f0;
            color: #334155;
            font-weight: 600;
            display: inline-block;
        }

        .total-row {
            background-color: #dbeafe !important;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-dark);
        }

        .total-row td {
            border-top: 2px solid var(--primary-dark);
            border-bottom: 2px solid var(--primary-dark);
            padding: 14px 15px;
        }

        /* Secao de Grafico */
        .chart-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed var(--border-color);
            page-break-inside: avoid;
        }

        .chart-section h2 {
            color: var(--primary-dark);
            font-size: 18px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .chart-container {
            position: relative;
            height: 380px;
            width: 100%;
        }

        /* Botoes de Acao por Linha */
        .btn-remove {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 0 5px;
        }

        .btn-remove:hover {
            color: #991b1b;
        }

        /* Estilos de Impressao (PDF) */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                padding: 0;
                width: 100%;
                max-width: 100%;
            }

            .no-print {
                display: none !important;
            }

            input, select {
                border: none !important;
                background: transparent !important;
                appearance: none;
                -webkit-appearance: none;
            }

            input[type="number"] {
                font-weight: 500;
            }

            .category-tag {
                border: 1px solid #cbd5e1;
            }

            th {
                background-color: #1e3a8a !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .total-row {
                background-color: #dbeafe !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .chart-section {
                margin-top: 40px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Cabecalho -->
    <div class="header">
        <h1>Demonstrativo de Custos Fixos</h1>
        <div class="actions no-print">
            <button class="btn btn-secondary" onclick="addSuggestedCategories()">+ Categorias Sugeridas</button>
            <button class="btn btn-secondary" onclick="addRow()">+ Adicionar Item</button>
            <button class="btn btn-danger" onclick="clearData()">Limpar Tudo</button>
            <button class="btn btn-primary" onclick="window.print()">🖨️ Salvar em PDF / Imprimir</button>
        </div>
    </div>

    <!-- Tabela -->
    <div class="table-container">
        <table id="costTable">
            <thead>
                <tr>
                    <th style="width: 35%;">Discriminação</th>
                    <th style="width: 25%;">Categoria de Custo</th>
                    <th class="amount" style="width: 30%;">Valor (R$)</th>
                    <th class="no-print" style="width: 10%; text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Linhas inseridas via Javascript -->
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="2">TOTAL DE CUSTOS FIXOS</td>
                    <td class="amount" id="totalValue">R$ 0,00</td>
                    <td class="no-print"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- Grafico -->
    <div class="chart-section">
        <h2>Distribuição dos Custos Fixos</h2>
        <div class="chart-container">
            <canvas id="costChart"></canvas>
        </div>
    </div>
</div>

<script>
    // Categorias modernas de custos fixos
    const CATEGORIES = [
        "Pessoal & Pro-Labore",
        "Ocupação & Estrutura",
        "Utilidades & Concessionárias",
        "Serviços Profissionais",
        "Sistemas & Tecnologia",
        "Marketing & Vendas",
        "Impostos & Tarifas Fixas",
        "Outras Despesas Fixas"
    ];

    // Sugestão de itens estruturados e profissionalizados
    const SUGGESTED_ITEMS = [
        { name: "Mão-de-Obra + Encargos Sociais", category: "Pessoal & Pro-Labore", value: 0 },
        { name: "Retirada dos Sócios (Pró-Labore)", category: "Pessoal & Pro-Labore", value: 0 },
        { name: "Aluguel & Condomínio", category: "Ocupação & Estrutura", value: 0 },
        { name: "Água, Luz e Gás", category: "Utilidades & Concessionárias", value: 0 },
        { name: "Internet, Telefone e Links", category: "Utilidades & Concessionárias", value: 0 },
        { name: "Serviços Contábeis (Contador)", category: "Serviços Profissionais", value: 0 },
        { name: "Assessoria Jurídica / Manutenção", category: "Serviços Profissionais", value: 0 },
        { name: "Softwares, ERP e Licenças SaaS", category: "Sistemas & Tecnologia", value: 0 },
        { name: "Propaganda, Marketing & Tráfego", category: "Marketing & Vendas", value: 0 },
        { name: "Seguros Empresariais & Veículos", category: "Ocupação & Estrutura", value: 0 },
        { name: "Depreciação de Ativos", category: "Outras Despesas Fixas", value: 0 },
        { name: "Tarifas Bancárias & Empréstimos (PRONAMP)", category: "Impostos & Tarifas Fixas", value: 0 }
    ];

    let items = [];
    let chartInstance = null;

    // Inicialização da Aplicação
    document.addEventListener("DOMContentLoaded", () => {
        loadData();
        initChart();
        render();
    });

    // Carregar dados do LocalStorage
    function loadData() {
        const saved = localStorage.getItem("fixed_costs_data");
        if (saved) {
            try {
                items = JSON.parse(saved);
            } catch (e) {
                items = [];
            }
        } else {
            items = []; // Inicia completamente limpo conforme solicitado
        }
    }

    // Salvar dados no LocalStorage
    function saveData() {
        localStorage.setItem("fixed_costs_data", JSON.stringify(items));
    }

    // Renderizar tabela e gráfico
    function render() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        if (items.length === 0) {
            tbody.innerHTML = `
                <tr class="no-print">
                    <td colspan="4" style="text-align: center; color: #64748b; padding: 20px;">
                        Nenhum item cadastrado. Clique em <b>"+ Adicionar Item"</b> ou <b>"+ Categorias Sugeridas"</b> para iniciar.
                    </td>
                </tr>
            `;
        }

        items.forEach((item, index) => {
            const tr = document.createElement("tr");

            // Categorias dropdown
            let categoryOptions = CATEGORIES.map(cat => 
                `<option value="${cat}" ${item.category === cat ? "selected" : ""}>${cat}</option>`
            ).join("");

            tr.innerHTML = `
                <td>
                    <input type="text" value="${item.name || ''}" placeholder="Ex: Aluguel" onchange="updateItem(${index}, 'name', this.value)">
                </td>
                <td>
                    <select onchange="updateItem(${index}, 'category', this.value)">
                        ${categoryOptions}
                    </select>
                </td>
                <td class="amount">
                    <input type="number" step="0.01" value="${item.value !== null && item.value !== undefined ? item.value : ''}" placeholder="0,00" onchange="updateItem(${index}, 'value', parseFloat(this.value) || 0)">
                </td>
                <td class="no-print" style="text-align: center;">
                    <button class="btn-remove" onclick="removeItem(${index})" title="Remover linha">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        calculateTotal();
        updateChart();
        saveData();
    }

    function addRow(name = "", category = CATEGORIES[0], value = 0) {
        items.push({ name, category, value });
        render();
    }

    function addSuggestedCategories() {
        if (items.length > 0) {
            if (!confirm("Deseja carregar a estrutura sugerida de custos fixos? Os dados atuais serão mantidos e os novos adicionados.")) {
                return;
            }
        }
        SUGGESTED_ITEMS.forEach(suggested => {
            items.push({ ...suggested });
        });
        render();
    }

    function removeItem(index) {
        items.splice(index, 1);
        render();
    }

    function updateItem(index, field, value) {
        items[index][field] = value;
        calculateTotal();
        updateChart();
        saveData();
    }

    function clearData() {
        if (confirm("Tem certeza que deseja apagar todos os lançamentos?")) {
            items = [];
            render();
        }
    }

    function calculateTotal() {
        const total = items.reduce((acc, curr) => acc + (parseFloat(curr.value) || 0), 0);
        document.getElementById("totalValue").innerText = total.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    // Inicialização do Gráfico
    function initChart() {
        const ctx = document.getElementById("costChart").getContext("2d");
        chartInstance = new Chart(ctx, {
            type: "bar",
            data: {
                labels: [],
                datasets: [{
                    label: "Valor do Custo (R$)",
                    data: [],
                    backgroundColor: "#2563eb",
                    borderColor: "#1e3a8a",
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let val = context.raw || 0;
                                return 'R$ ' + val.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return 'R$ ' + value.toLocaleString('pt-BR');
                            }
                        }
                    },
                    x: {
                        ticks: {
                            maxRotation: 45,
                            minRotation: 0,
                            font: {
                                size: 10
                            }
                        }
                    }
                }
            }
        });
    }

    // Atualização dos dados do Gráfico
    function updateChart() {
        if (!chartInstance) return;

        // Filtrar apenas itens com nome e valor > 0 para o gráfico não poluir
        const chartItems = items.filter(i => i.name && i.value > 0);

        chartInstance.data.labels = chartItems.map(i => i.name);
        chartInstance.data.datasets[0].data = chartItems.map(i => i.value);
        chartInstance.update();
    }
</script>

</body>
</html>
